# THE UNDERMIND: configuration
#
# Nothing here scripts the story. It chooses which models play, how long the game runs, and
# how dangerous it is for them.

api:
  provider: ollama             # ollama (local models), anthropic (hosted), or mock (offline dry run, never a real player)
  model: llama3.2:3b           # used only for a mind that has no model of its own
  ollama_url: http://localhost:11434
  api_key_env: ANTHROPIC_API_KEY
  temperature: 0.9
  timeout: 180                 # seconds to wait for one reply
  keep_alive: 10m              # how long ollama keeps a model loaded
  num_ctx: 4096                # context window per call; smaller loads faster and needs less memory

# Which models play.
#   auto            choose a different small chat model for each mind from the catalog of 270 model
#                   families (see docs/MODELS.md), and install any that are missing. This is the default.
#   [a, b, c]       a fixed list of ollama tags, handed out to the minds in order
models: auto
max_model_gb: 2.5              # largest model `auto` will choose (approximate download size)
auto_install: true             # download models that are not on this machine yet

# Who fights. Persona ids: vellum, glitchwick, aurelia, rictus, jester9, sage, rust, understudy.
# A mind can be pinned to a model:  - {persona: vellum, model: llama3.2:3b}
roster:
  - vellum
  - glitchwick
  - aurelia
  - rictus
  - jester9
  - sage

# The Registrar (narrator) and God (scenario writer) each need a steady voice that is not at stake.
# null picks a model that was already installed when the arena first ran, so it can never be deleted.
narrator_model: null
god_model: null

game:
  endless: true                # when a season ends, God opens the next one and the run carries on
  god: true                    # God writes each cycle's twist; false uses the fixed deck of 18 Notices
  cycles: 12                   # cycles per season; the season ends in The Backlog if nobody decided anything
  arrivals_max: 2              # strangers God may bring in per season
  max_wicks: 8                 # most minds in the Undermind at once
  min_minds: 4                 # a new season refills the roster up to this many
  permadeath: true             # a dissolved mind's model is DELETED from this machine (see README)
  parley_rounds: 1             # how many times each mind may speak per cycle
  siege_exchanges: 3           # messages each side gets in a Mind-Siege
  workers: 1                   # above 1 asks the minds for their secret actions in parallel (hosted APIs)
  act2_cycle: 4
  act3_cycle: 8                # Act III also begins when three or fewer minds remain
  start_lumens: 12
  ember_start: 100

pace: 0.35                     # speed of the Theatre; 0.35 is natural, 0 skips the pauses
